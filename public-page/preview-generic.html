<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public page preview — GENERIC v1</title>
    <link rel="stylesheet" href="./components.css" />
  </head>
  <body>
    <main class="wp-page" data-preview="generic-v1">
      <header class="wp-brand" aria-label="betterpet Passport">
        <span class="wp-brand__mark" aria-hidden="true">b</span>
        <div>
          <p class="wp-brand__wordmark">betterpet</p>
          <p class="wp-brand__product">Passport</p>
        </div>
      </header>

      <article class="wp-hero">
        <div class="wp-hero__face wp-hero__face--front">
          <div class="wp-identity">
            <div class="wp-photo wp-photo--fallback" aria-hidden="true">S</div>
            <div>
              <h1 class="wp-identity__title">Stay with Pico</h1>
              <p class="wp-identity__subtitle">Demo reservation card</p>
            </div>
          </div>
          <dl class="wp-card" style="width: 100%">
            <div class="wp-fact"><dt class="wp-fact__term">guest</dt><dd class="wp-fact__value">Alex Rivera</dd></div>
            <div class="wp-fact"><dt class="wp-fact__term">dates</dt><dd class="wp-fact__value">12–15 Sep</dd></div>
            <div class="wp-fact"><dt class="wp-fact__term">unit</dt><dd class="wp-fact__value">Cabin 4</dd></div>
          </dl>
          <div class="wp-card" style="width: 100%">
            <a
              class="wp-row"
              href="https://example.com/stay/demo-a"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="wp-thumb" aria-hidden="true">↗</span>
              <span class="wp-row__body">
                <p class="wp-row__title">Details</p>
                <p class="wp-row__meta">example.com/stay/demo-a</p>
              </span>
              <span class="wp-chevron" aria-hidden="true">›</span>
            </a>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
