<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet template browser</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #14142b;
      --muted: #66677c;
      --surface: #ffffff;
      --line: #dedfec;
      --brand: #142fe1;
      --brand-dark: #0d1d94;
      --wash: #f4f5fb;
      --success: #0b7a55;
      --error: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    header {
      padding: 40px max(24px, calc((100vw - 1120px) / 2));
      color: white;
      background: linear-gradient(120deg, #111b66, var(--brand));
    }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 44px); }
    header p { margin: 0; opacity: .86; }
    main {
      display: grid;
      grid-template-columns: minmax(260px, .8fr) minmax(400px, 1.35fr);
      gap: 24px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }
    .panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 30px rgb(20 20 43 / 6%);
    }
    h2 { margin: 0 0 16px; font-size: 20px; }
    .template-list { display: grid; gap: 12px; }
    .template {
      width: 100%;
      padding: 16px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }
    .template:hover, .template[aria-pressed="true"] {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgb(20 47 225 / 12%);
    }
    .template strong { display: block; font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; }
    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 99px;
      background: #e9ebff;
      color: var(--brand-dark);
      font-size: 11px;
      font-weight: 700;
    }
    label { display: block; margin: 14px 0 6px; font-weight: 700; }
    select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--ink);
    }
    select { padding: 10px 12px; }
    textarea {
      min-height: 390px;
      padding: 14px;
      resize: vertical;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .actions { display: flex; gap: 10px; margin-top: 16px; }
    button.primary, a.action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: white;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }
    button.primary:disabled { opacity: .55; cursor: wait; }
    .result {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 12px;
      background: #effaf6;
      color: var(--success);
    }
    .result.error { background: #fff0ef; color: var(--error); }
    .result pre {
      overflow: auto;
      margin: 10px 0 0;
      color: var(--ink);
      font-size: 12px;
      white-space: pre-wrap;
    }
    .result-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .empty { color: var(--muted); }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      textarea { min-height: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Wallet template browser</h1>
    <p>Choose a file-based template, edit simple data, and request one wallet provider.</p>
  </header>
  <main>
    <section class="panel">
      <h2>Available templates</h2>
      <div id="templates" class="template-list">
        <p class="empty">Loading templates…</p>
      </div>
    </section>
    <section class="panel">
      <h2 id="editor-title">New wallet</h2>
      <label for="provider">Provider</label>
      <select id="provider">
        <option value="APPLE">Apple</option>
        <option value="GOOGLE">Google</option>
      </select>
      <label for="payload">Request JSON</label>
      <textarea id="payload" spellcheck="false" aria-label="Wallet request JSON"></textarea>
      <div class="actions">
        <button id="create" class="primary" type="button">Create wallet</button>
      </div>
      <div id="result" class="result" role="status"></div>
    </section>
  </main>
  <script>
    const templateList = document.querySelector("#templates");
    const editorTitle = document.querySelector("#editor-title");
    const provider = document.querySelector("#provider");
    const payload = document.querySelector("#payload");
    const createButton = document.querySelector("#create");
    const result = document.querySelector("#result");
    let templates = [];
    let selectedKey = "";

    function format(value) {
      return JSON.stringify(value, null, 2);
    }

    function selectTemplate(template) {
      selectedKey = `${template.key}:${template.version}`;
      editorTitle.textContent = `New ${template.key} wallet`;
      const example = structuredClone(template.example);
      example.template = template.key;
      example.templateVersion = template.version;
      example.provider = provider.value;
      payload.value = format(example);
      document.querySelectorAll(".template").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.id === selectedKey));
      });
      result.style.display = "none";
    }

    function renderTemplates() {
      templateList.replaceChildren();
      if (!templates.length) {
        templateList.innerHTML = '<p class="empty">No file-based templates found.</p>';
        return;
      }
      templates.forEach((template) => {
        const button = document.createElement("button");
        button.className = "template";
        button.type = "button";
        button.dataset.id = `${template.key}:${template.version}`;
        button.setAttribute("aria-pressed", "false");
        const fieldCount = Object.keys(template.schema?.properties || {}).length;
        button.innerHTML = `
          <strong>${template.key}<span class="badge">v${template.version}</span></strong>
          <span class="meta">${fieldCount} data fields${template.current ? " · current" : ""}</span>
        `;
        button.addEventListener("click", () => selectTemplate(template));
        templateList.append(button);
      });
      selectTemplate(templates.find((item) => item.key === "PET_CARD") || templates[0]);
    }

    provider.addEventListener("change", () => {
      try {
        const body = JSON.parse(payload.value);
        body.provider = provider.value;
        payload.value = format(body);
      } catch (_) {}
    });

    createButton.addEventListener("click", async () => {
      result.className = "result";
      result.style.display = "block";
      result.textContent = "Creating wallet…";
      createButton.disabled = true;
      try {
        const body = JSON.parse(payload.value);
        body.provider = provider.value;
        const response = await fetch("/api/wallets", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const responseBody = await response.json();
        if (!response.ok) {
          const message = responseBody.code === "UNKNOWN_TEMPLATE"
            ? `${responseBody.message}. Restart mi-wallet-service to reload newly added template files.`
            : responseBody.message || `Request failed (${response.status})`;
          throw new Error(message, {
            cause: responseBody,
          });
        }
        const links = [];
        if (responseBody.publicUrl) {
          links.push(`<a class="action" target="_blank" rel="noreferrer" href="${responseBody.publicUrl}">Open public page</a>`);
        }
        if (responseBody.provider?.url) {
          links.push(`<a class="action" target="_blank" rel="noreferrer" href="${responseBody.provider.url}">Open ${responseBody.provider.type}</a>`);
        }
        result.innerHTML = `
          <strong>Wallet created</strong>
          <div class="result-links">${links.join("")}</div>
          <pre>${format(responseBody)}</pre>
        `;
      } catch (error) {
        result.className = "result error";
        result.innerHTML = `<strong>Could not create wallet</strong><pre>${error.message}</pre>`;
      } finally {
        createButton.disabled = false;
      }
    });

    fetch("/api/templates")
      .then((response) => response.json())
      .then((body) => {
        templates = body.templates || [];
        renderTemplates();
      })
      .catch((error) => {
        templateList.innerHTML = `<p class="empty">${error.message}</p>`;
      });
  </script>
</body>
</html>
